            --surface: #131211;
            --surface2: #1A1917;
            --text: #F0EBE1;
            --text-secondary: #C8C0B5;
            --text-dim: #8A837A;
            --gold: #C9A84C;
            --gold-dark: #A8873A;
            --gold-glow: rgba(201,168,76,0.15);
            --mask-gradient: linear-gradient(90deg,#B5312A,#C4581F,#B8930A,#2D7A4F,#1D5F8A,#5C3280,#7A3594);
            --mc: #C9A84C;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Jost', system-ui, sans-serif;
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            background:var(--bg);color:var(--text);
            font-family:var(--font-body);font-weight:300;
            line-height:1.7;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;

        /* ── LOADING / ERROR ── */

        .load-ring{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,0.06);border-top-color:var(--gold);animation:spin 1s linear infinite;}

        .load-text{font-family:var(--font-display);font-size:18px;font-style:italic;color:var(--text-secondary);}
        #error-screen{display:none;max-width:520px;margin:80px auto;padding:0 16px;text-align:center;}
        #error-screen h2{font-family:var(--font-display);font-size:28px;font-weight:300;margin-bottom:14px;}
        #error-screen p{color:var(--text-secondary);margin-bottom:24px;}

        .btn-retry:hover{background:var(--gold-glow);color:#fff;}

        /* ── PORTRAIT CARD PREMIUM ── */
        .portrait-card{
            background:var(--surface);border:1px solid rgba(255,255,255,0.06);
            border-radius:var(--radius-lg);padding:60px 40px 50px;
            position:relative;overflow:hidden;
            box-shadow:0 30px 80px rgba(0,0,0,0.6);
            display:flex;flex-direction:column;gap:48px;
        }
        .portrait-card::before{
            content:'';position:absolute;top:0;left:0;right:0;
            height:4px;background:var(--mask-gradient);
        }
        .portrait-card::after{
            content:'';position:absolute;top:0;left:0;right:0;bottom:0;
            background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 70%);
            pointer-events:none;
        }

        /* ── HEADER ── */
        .profile-header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;}
        .greeting{font-family:var(--font-display);font-size:1.4rem;font-style:italic;color:var(--text-secondary);opacity:0.9;margin-bottom:28px;}
        .greeting em{color:var(--gold);font-style:normal;}

        .mask-circle{
            width:220px;height:220px;border-radius:50%;
            margin:16px auto 12px;position:relative;
            box-shadow:0 0 60px var(--mc),0 0 120px rgba(0,0,0,0.6);
            animation:floatGlow 4s ease-in-out infinite alternate;
            display:flex;align-items:center;justify-content:center;
            background:transparent;
        }
        .mask-circle img{
            width:100%;height:100%;object-fit:contain;
            border-radius:50%;filter:drop-shadow(0 0 20px var(--mc));
            z-index:2;
        }

            from{box-shadow:0 0 40px var(--mc),0 0 80px rgba(0,0,0,0.5)}
            to{box-shadow:0 0 80px var(--mc),0 0 160px rgba(0,0,0,0.7)}

        .profile-type-badge{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--mc);opacity:0.85;margin-bottom:4px;}
        .mask-name{font-family:var(--font-display);font-size:4.5rem;font-weight:300;line-height:1.05;text-align:center;color:var(--mc);margin-bottom:4px;letter-spacing:-0.02em;}
        .mask-protect{font-family:var(--font-display);font-size:1.3rem;font-style:italic;color:var(--text-secondary);text-align:center;margin-bottom:24px;}

        /* ── MIRROR ── */
        .mirror-phrase{
            font-family:var(--font-display);font-size:2rem;font-style:italic;
            color:var(--text);padding:24px 28px;
            border-left:5px solid var(--mc);
            background:rgba(201,168,76,0.04);
            border-radius:0 var(--radius-md) var(--radius-md) 0;
            line-height:1.5;margin:20px 0;
            position:relative;z-index:1;
        }
        .mirror-phrase::before{content:"“";position:absolute;top:-20px;left:10px;font-size:6rem;color:var(--mc);opacity:0.3;line-height:1;}

        /* ── BEHAVIOURS (ligne discrète) ── */
        .behaviours-inline{
            font-size:0.95rem;color:var(--text-dim);text-align:center;
            line-height:1.8;z-index:1;letter-spacing:0.3px;
            margin:8px 0 16px;
        }
        .behaviours-inline span{color:var(--text-secondary);}

        /* ── FORCE ── */
        .force-block{margin:20px 0;z-index:1;background:linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 50%);border:1px solid rgba(201,168,76,0.15);border-radius:var(--radius-md);padding:32px 36px;}
        .force-label{font-family:var(--font-display);font-size:1rem;letter-spacing:3px;text-transform:uppercase;color:var(--mc);margin-bottom:12px;display:block;}
        .force-text{font-family:var(--font-display);font-size:1.7rem;font-style:italic;color:var(--text);line-height:1.5;}

        /* ── COMBO ── */
        .combo-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-md);padding:28px 32px;margin:16px 0;font-size:1.05rem;color:var(--text-secondary);line-height:1.7;z-index:1;}
        .combo-box strong{color:var(--text);font-weight:500;}
        .combo-name{font-family:var(--font-display);font-size:1.5rem;font-weight:400;color:var(--mc);margin-bottom:12px;display:block;}

        /* ── SPA ── */
        .spa-block{display:flex;align-items:center;gap:20px;padding:24px 30px;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.15);border-radius:var(--radius-md);margin:16px 0;z-index:1;}
        .spa-sun{font-size:2.2rem;opacity:0.95;flex-shrink:0;}
        .spa-text{font-size:1rem;color:var(--text-secondary);line-height:1.6;}
        .spa-text strong{color:var(--gold);}

        /* ── DEO NOTE ── */
        .deo-note{margin:24px 0 0;padding:18px 24px;background:rgba(255,255,255,0.02);border-left:2px solid rgba(255,255,255,0.08);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:0.9rem;color:var(--text-dim);line-height:1.7;z-index:1;}
        .deo-note a{color:var(--text-secondary);text-decoration:none;}
        .deo-note a:hover{color:var(--gold);}

        /* ── CTA ── */
        .btn-cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--mc);color:var(--bg);font-family:var(--font-body);font-size:1.1rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:22px;border-radius:60px;text-decoration:none;margin:24px 0 0;transition:all 0.25s;border:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,0.5);z-index:1;}

        /* ── SHARE SECTION (deux boutons) ── */
        .share-section{margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.07);text-align:center;z-index:1;}

        .share-subtitle{font-size:0.95rem;color:var(--text-secondary);margin-bottom:24px;}
        .share-buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;}

        .share-btn{
            display:inline-flex;align-items:center;gap:10px;
            background:var(--mc);color:var(--bg);
            border:1px solid var(--mc);border-radius:40px;
            padding:14px 32px;font-size:1rem;font-weight:500;
            cursor:pointer;transition:all 0.2s;
            box-shadow:0 6px 20px rgba(0,0,0,0.4);
            text-decoration:none;
        }
        .share-btn:hover{background:var(--gold-dark);border-color:var(--gold-dark);transform:translateY(-1px);}

        .share-btn.download{
            background:transparent;color:var(--mc);border:1px solid var(--mc);
        }
        .share-btn.download:hover{background:var(--mc);color:var(--bg);}

        .share-btn.whatsapp{
            background:#25D366;border-color:#25D366;color:#fff;
        }
        .share-btn.whatsapp:hover{background:#1da851;border-color:#1da851;}

        .share-generating{text-align:center;font-size:0.85rem;color:var(--text-dim);padding:12px;display:none;}

        /* ── SHARE CARD (off-screen) ── */
        #share-card{
            position:fixed;left:-9999px;top:-9999px;
            width:400px;height:400px;
            background:#0B0A0A;overflow:hidden;
            font-family:'Cormorant Garamond',Georgia,serif;
        }
        .sc-chroma{height:5px;background:linear-gradient(90deg,#B5312A,#C4581F,#B8930A,#2D7A4F,#1D5F8A,#5C3280,#7A3594);}
        .sc-body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 5px);padding:24px 28px;text-align:center;}
        .sc-img-wrap{width:100px;height:100px;border-radius:50%;overflow:hidden;position:relative;margin-bottom:16px;flex-shrink:0;}
        .sc-img{width:100%;height:100%;object-fit:cover;}
        .sc-overlay{position:absolute;inset:0;border-radius:50%;background:var(--sc-color,#C9A84C);opacity:0.3;}
        .sc-mask-name{font-size:44px;font-weight:300;line-height:1.1;margin-bottom:6px;}
        .sc-protect{font-size:14px;font-style:italic;color:#A89E90;margin-bottom:14px;}
        .sc-phrase{font-size:15px;font-style:italic;color:#F0EBE1;line-height:1.45;margin-bottom:12px;}
        .sc-question{font-size:13px;color:var(--gold);margin-bottom:18px;font-style:italic;}
        .sc-brand{font-family:'Jost',system-ui,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6B6460;margin-top:auto;}
        .sc-brand span{color:#C9A84C;}

        /* ── MOBILE ── */
        @media(max-width:480px){
            .page{padding:44px 12px 80px;}
            .portrait-card{padding:40px 20px 36px;gap:36px;}
            .mask-circle{width:180px;height:180px;}
            .mask-name{font-size:3.2rem;}
            .mirror-phrase{font-size:1.6rem;padding:18px 20px;}
            .force-text{font-size:1.3rem;}
            .btn-cta{padding:20px;font-size:1rem;}
            .share-btn{padding:12px 28px;font-size:0.9rem;}
        }
    </style>
</head>

    "jaune+orange+vert":    { name:"La Triade de la Rumination Émotionnelle", loop:"Attentes → adaptation → planification → coupure → perte de soi." },
    "indigo+jaune+rouge":   { name:"La Triade de la Performance Anxieuse", loop:"Sensation → alarme → perfection → protocoles → stress → fatigue." },
    "bleu+vert+violet":     { name:"Fusionner pour Exister",         loop:"Relation → contrôle → fusion → dissolution → menace existentielle." },
    "bleu+jaune+orange":    { name:"L'Efficacité Froide",            loop:"Situation → contrôle + anticipation → coupure → relations appauvries → solitude." },
    "rouge+vert+violet":    { name:"La Triple Fragilité",            loop:"Symptôme → besoin de l'autre → question identitaire → confusion → anxiété." },
    "indigo+jaune+violet":  { name:"La Triade du Doute Existentiel", loop:"Décision → perfection → certitude → absence de soi → épuisement." }
};

const PAN_MASQUE = {
    name:"L'Adaptation Multi-Protection",
    desc:"Vous n'avez pas construit un seul mur — mais un filet souple, adaptable à chaque situation. Cette plasticité est une intelligence remarquable, mais elle a un coût : une fatigue diffuse et la sensation de ne pas avoir de 'chez-soi' intérieur.",
    loop:"Une situation active un masque → un deuxième s'active avant désactivation du premier → les masques s'empilent → fatigue chronique."
};

// ═══════════════ FONCTIONS ══════════════
function readData() {
    const p = new URLSearchParams(location.search);
    const scores = {};
    MASKS.forEach(m => { if(p.has(m)) scores[m] = Math.min(100, Math.max(0, parseInt(p.get(m)) || 0)); });
    const validCount = MASKS.filter(m => scores[m] !== undefined).length;
    const prenom = decodeURIComponent(p.get('prenom') || '');
    const email  = sessionStorage.getItem('vEmail') || '';
    return { scores, prenom, email, valid: validCount === 7 };
}

function detectProfile(scores) {
    const VALID_DYADS  = Object.keys(DYADS).map(k => k.split('+').sort());
    const VALID_TRIADS = Object.keys(TRIADS).map(k => k.split('+').sort());
    const sorted = MASKS.map(m => ({ key:m, pct: scores[m] || 0 }))
        .sort((a,b) => b.pct - a.pct || TIEBREAK.indexOf(a.key) - TIEBREAK.indexOf(b.key));
    const [s0,s1,s2,s3] = sorted;
    const S1=s0.pct, S2=s1?.pct||0, S3=s2?.pct||0, S4=s3?.pct||0;

    if (S1 < 50) return { type: S1<30?'adaptatif_eq':'adaptatif_vig', masks:sorted.map(m=>m.key), primary:s0.key };
    const active60 = sorted.filter(m => m.pct >= 60);
    if (active60.length >= 5) {
        const spread = Math.max(...active60.map(m=>m.pct)) - Math.min(...active60.map(m=>m.pct));
        if (spread <= 20) return { type:'pan', masks:active60.map(m=>m.key), primary:s0.key };
    }
    if (S1>=60 && S2>=55 && S3>=55 && (S1-S3)<=15 && (S2-S4)>10) {
        const tri = [s0.key,s1.key,s2.key].sort();
        if (VALID_TRIADS.some(t=>t.join(',')===tri.join(','))) return { type:'triade', masks:tri, primary:s0.key };
    }
    if (S1>=55 && S2>=55 && S3>=55 && (S1-S3)<=10) {
        const tri = [s0.key,s1.key,s2.key].sort();
        if (VALID_TRIADS.some(t=>t.join(',')===tri.join(','))) return { type:'triade', masks:tri, primary:s0.key };
    }
    if (S1>=65 && S2>=65 && S3<55 && (S1-S2)<=10) {
        const pair = [s0.key,s1.key].sort();
        if (VALID_DYADS.some(d=>d.join(',')===pair.join(','))) return { type:'dyade', masks:pair, primary:s0.key, secondary:s1.key };
    }
    if (S1>=55 && S2>=55 && S3<50 && (S1-S2)<=10) {
        const pair = [s0.key,s1.key].sort();
        if (VALID_DYADS.some(d=>d.join(',')===pair.join(','))) return { type:'dyade_moderee', masks:pair, primary:s0.key, secondary:s1.key };
    }
    if (S1>=75 && (S1-S2)>10) return { type:'mono', masks:[s0.key], primary:s0.key, secondary: S2>=60?s1.key:null };
    if (S1>=60 && (S1-S2)>10) return { type:'mono_fort', masks:[s0.key], primary:s0.key };
    return { type:'residuel', masks:[s0.key], primary:s0.key };
}

function getComboHTML(profile, scores) {
    const SUGGEST = {
        rouge:{p:'jaune',k:'jaune+rouge'}, orange:{p:'vert',k:'orange+vert'},
        jaune:{p:'bleu',k:'bleu+jaune'},  vert:{p:'indigo',k:'indigo+vert'},
        bleu:{p:'indigo',k:'bleu+indigo'},indigo:{p:'jaune',k:'indigo+jaune'},
        violet:{p:'orange',k:'orange+violet'}
    };
    if (profile.type==='pan') return `<div class="combo-box"><span class="combo-name">${PAN_MASQUE.name}</span>${PAN_MASQUE.desc}<br><br><em>Boucle :</em> ${PAN_MASQUE.loop}</div>`;
    if (profile.type==='triade') {
        const key = [...profile.masks].sort().join('+');
        const t = TRIADS[key];
        if (t) return `<div class="combo-box"><span class="combo-name">Triade · ${t.name}</span><em>Boucle :</em> ${t.loop}</div>`;
    }
    if (profile.type==='dyade'||profile.type==='dyade_moderee') {
        const key = [...profile.masks].sort().join('+');
        const d = DYADS[key];
        if (d) return `<div class="combo-box"><span class="combo-name">Dyade · ${d.name}</span><em>Boucle :</em> ${d.loop}</div>`;
    }
    if (profile.type==='mono'&&profile.secondary) {
        const key=[profile.primary,profile.secondary].sort().join('+');
        const d=DYADS[key];
        if(d) return `<div class="combo-box"><span class="combo-name">Dyade probable · ${d.name}</span>Un second masque semble actif — Masque ${MASK_LABELS[profile.secondary]}.<br><em>Boucle typique :</em> ${d.loop}</div>`;
    }
    const s = SUGGEST[profile.primary];
    if (s) {
        const d = DYADS[s.k];
        if (d) return `<div class="combo-box"><em>D'après votre profil, un second masque pourrait être actif :</em><br><span class="combo-name">${d.name}</span>Masque ${MASK_LABELS[s.p]} — <em>Boucle :</em> ${d.loop}</div>`;
    }
    return '';
}

function getMaskImage(profile) {
    if (profile.type === 'pan') return 'pan-masque.png';
    return 'masque-' + profile.primary + '.png';
}

// ═══════════════ CONSTRUCTION PORTRAIT ══════════════
function buildPortrait(data, profile) {
    const { scores, prenom } = data;
    const dom   = profile.primary;
    const color = MASK_COLORS[dom];
    const mirror = profile.type==='pan' ? PAN_MIRROR : MIRROR[dom];
    const greeting = prenom ? `Bonjour <em>${prenom}</em> —` : 'Votre portrait V.A.L.E.U.R©';
    const maskImg = getMaskImage(profile);

    let profileLabel = '';
    if (profile.type==='pan') profileLabel = 'Profil Pan-masques';
    else if (profile.type==='triade') profileLabel = 'Configuration Triade';
    else if (profile.type.startsWith('dyade')) profileLabel = 'Configuration Dyade';
    else if (profile.type==='mono') profileLabel = 'Masque Dominant';
    else if (profile.type==='mono_fort') profileLabel = 'Masque Fort';
    else if (profile.type.startsWith('adaptatif')) profileLabel = 'Profil Adaptatif';
    else profileLabel = 'Votre Masque';

    const behavioursList = (BEHAVIOURS[dom] || []).join(' <span>·</span> ');

    return `
    <div class="portrait-card" id="portrait-card" style="--mc:${color}">
        <div class="profile-header">
            <p class="greeting">${greeting}</p>
            <div class="mask-circle">
                <img src="${maskImg}" alt="Masque ${MASK_LABELS[dom]}" onerror="this.src='pan-masque.png'">
            </div>
            <div class="profile-type-badge">${profileLabel}</div>
            <h1 class="mask-name">Masque ${MASK_LABELS[dom]}</h1>
            <p class="mask-protect">Ce n'est pas vous. C'est votre protection.</p>
        </div>

        <div class="mirror-phrase">"${mirror}"</div>
        <div class="behaviours-inline">${behavioursList}</div>

        <div class="force-block">
            <span class="force-label">Force cachée</span>
            <div class="force-text">${FORCE[dom]}</div>
        </div>

        ${getComboHTML(profile, scores)}

        <div class="spa-block">
            <span class="spa-sun">☀</span>
            <p class="spa-text">
                <strong>Score de Présence Authentique</strong><br>
                Ce score mesure votre espace de liberté existant. Il est évalué avec précision lors de l'évaluation complète de 85 questions en cabinet.
            </p>
        </div>

        <a href="${DOCTOLIB_URL}" target="_blank" rel="noopener" class="btn-cta"
            style="background:${color};color:${dom==='jaune'?'#0B0A0A':'#F0EBE1'}">
            Faire le test complet en cabinet →
        </a>

        <div class="deo-note">
            <strong>Note :</strong> Ce résultat repose sur un premier niveau d'analyse (21 questions). Il donne une orientation — pas un portrait fiable. Seule l'évaluation approfondie de 85 questions, réalisée avec Céline Bourbon en première séance, permet de dessiner votre profil complet. <a href="accompagnement.html">En savoir plus →</a>
        </div>

        <div class="share-section">
            <p class="share-title">Partager mon portrait</p>
            <p class="share-subtitle">Téléchargez votre carte ou partagez-la directement.</p>
            <p class="share-generating" id="share-generating">Génération de la carte…</p>
            <div class="share-buttons">
                <button class="share-btn download" onclick="downloadCard()">⬇ Télécharger la carte</button>
                <button class="share-btn whatsapp" id="shareWhatsAppBtn" onclick="shareViaWhatsApp()">📤 Partager sur WhatsApp</button>
            </div>
        </div>
    </div>`;
}

// ═══════════════ SHARE CARD ══════════════
function prepareShareCard(dom, mirror, color, maskImgUrl) {
    document.getElementById('sc-img').src = maskImgUrl;
    document.getElementById('sc-mask-name').textContent = 'Masque ' + MASK_LABELS[dom];
    document.getElementById('sc-mask-name').style.color = color;
    document.getElementById('sc-phrase').textContent = mirror;
    document.getElementById('sc-overlay').style.background = color;
    document.documentElement.style.setProperty('--sc-color', color);
}

let cardBlobUrl = null;
let currentMaskImage = '';

async function generateCard(dom, mirror, color, maskImgUrl) {
    prepareShareCard(dom, mirror, color, maskImgUrl);
    const sc = document.getElementById('share-card');
    await document.fonts.ready;
    const canvas = await html2canvas(sc, {
        scale: 2.7,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#0B0A0A',
        logging: false
    });
    return new Promise(resolve => {
        canvas.toBlob(blob => {
            if (cardBlobUrl) URL.revokeObjectURL(cardBlobUrl);
            cardBlobUrl = URL.createObjectURL(blob);
            resolve({ blob, dataUrl: canvas.toDataURL('image/png'), blobUrl: cardBlobUrl });
        }, 'image/png');
    });
}

async function downloadCard() {
    const gen = document.getElementById('share-generating');
    gen.style.display = 'block';
    try {
        const { blobUrl } = await generateCard(_dom, _mirror, _color, currentMaskImage);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `masque-valeur-${_dom}.png`;
        a.click();
    } catch(e) { alert('Impossible de générer la carte.'); }
    finally { gen.style.display = 'none'; }
}

async function shareViaWhatsApp() {
    const gen = document.getElementById('share-generating');
    gen.style.display = 'block';
    try {
        const { blob } = await generateCard(_dom, _mirror, _color, currentMaskImage);
        const file = new File([blob], `masque-valeur-${_dom}.png`, { type: 'image/png' });
        const shareText = `J'ai découvert mon Masque ${MASK_LABELS[_dom]} avec V.A.L.E.U.R©. Et vous ?`;
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                files: [file],
                title: `Mon Masque ${MASK_LABELS[_dom]} · V.A.L.E.U.R©`,
                text: shareText
            });
        } else {
            // Fallback : télécharger l'image et ouvrir WhatsApp avec le message seul
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `masque-valeur-${_dom}.png`;
            a.click();
            window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
        }
    } catch(e) {
        if (e.name !== 'AbortError') console.warn('Share error:', e);
        const { blob } = await generateCard(_dom, _mirror, _color, currentMaskImage);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `masque-valeur-${_dom}.png`;
        a.click();
    } finally {
        gen.style.display = 'none';
    }
}

// ═══════════════ BACKEND / EMAIL ══════════════
async function saveToDatabase(data, profile) {
    const { scores, prenom, email } = data;
    const dom = profile.primary;
    const payload = {
        prenom, email,
        masque_dominant: MASK_LABELS[dom],
        peur_centrale: FEARS[dom],
        profile_type: profile.type,
        test_type: 'flash',
        date_passation: new Date().toISOString().split('T')[0],
        scores: JSON.stringify(scores)
    };
    try {
        const r = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-cabinet-secret': API_SECRET },
            body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
    } catch(e) { console.warn('DB save skipped:', e.message); return null; }
}

function sendPortraitEmail(data, profile) {
    if (!data.email) return;
    const dom = profile.primary;
    try {
        emailjs.init({ publicKey: 'Qamyb35cCRJ5Pulqs' });
        emailjs.send('service_valeur', 'template_inscription', {
            to_email: data.email,
            prenom: data.prenom || 'vous',
            masque_dominant: MASK_LABELS[dom],
            peur_centrale: FEARS[dom],
            message_accueil: `Votre test éclair V.A.L.E.U.R© — Masque ${MASK_LABELS[dom]}`,
            lien_rapport: window.location.href,
            lien_livret: 'https://valeur.psyh.fr/accompagnement.html',
            lien_psycho: 'https://valeur.psyh.fr/accompagnement.html',
            lien_fiche: 'https://valeur.psyh.fr/methode.html',
            lien_recuperation: window.location.href,
            date_passation: new Date().toLocaleDateString('fr-FR')
        });
    } catch(e) { console.warn('Email skipped:', e.message); }
}

// ═══════════════ INIT ══════════════
let _dom, _mirror, _color;

async function init() {
    const data = readData();
    if (!data.valid) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-screen').style.display = 'block';
        return;
    }

    const profile = detectProfile(data.scores);
    _dom   = profile.primary;
    _mirror = profile.type==='pan' ? PAN_MIRROR : MIRROR[_dom];
    _color = MASK_COLORS[_dom];
    currentMaskImage = getMaskImage(profile);

    document.getElementById('portrait-content').innerHTML = buildPortrait(data, profile);

    const items = document.querySelectorAll('.portrait-card > *');
    items.forEach((el, i) => { el.style.animation = `fadeUp 0.5s ease ${i * 0.06}s both`; });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('portrait-page').style.display = 'block';

    saveToDatabase(data, profile);
    if (data.email) sendPortraitEmail(data, profile);
}

init();
</script>
