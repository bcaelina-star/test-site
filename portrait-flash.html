<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="twitter:description" content="Ce qui est plus fort que moi — enfin nommé. Méthode V.A.L.E.U.R© · Céline Bourbon, Psychologue.">
    <meta name="twitter:image" content="https://valeur.psyh.fr/valeur-og-image.png">
    <meta name="description" content="Votre portrait V.A.L.E.U.R© — Découvrez le masque qui vous empêche d'être vous-même. Psychologue Bordeaux, anxiété, schémas répétitifs.">
    <title>Mon Portrait · V.A.L.E.U.R© · Céline Bourbon, Psychologue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0B0A0A;
            --surface: #131211;
            --surface2: #1A1917;
            --text: #F0EBE1;
            --text-secondary: #C8C0B5;
            --text-dim: #8A837A;
            --gold: #C9A84C;
            --gold-dark: #A8873A;
            --gold-glow: rgba(201,168,76,0.15);
            --mask-gradient: linear-gradient(90deg,#B5312A,#C4581F,#B8930A,#2D7A4F,#1D5F8A,#5C3280,#7A3594);
            --mc: #C9A84C;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Jost', system-ui, sans-serif;
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            background:var(--bg);color:var(--text);
            font-family:var(--font-body);font-weight:300;
            line-height:1.7;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;
        }

        .chroma{height:3px;background:var(--mask-gradient);position:fixed;top:0;left:0;right:0;z-index:100;}

        .page{max-width:620px;width:100%;margin:0 auto;padding:60px 20px 80px;}

        /* ── LOADING / ERROR ── */
        #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200;}
        .load-ring{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,0.06);border-top-color:var(--gold);animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .load-text{font-family:var(--font-display);font-size:18px;font-style:italic;color:var(--text-secondary);}
        #error-screen{display:none;max-width:520px;margin:80px auto;padding:0 16px;text-align:center;}
        #error-screen h2{font-family:var(--font-display);font-size:28px;font-weight:300;margin-bottom:14px;}
        #error-screen p{color:var(--text-secondary);margin-bottom:24px;}
        .btn-retry{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:14px 28px;border-radius:40px;cursor:pointer;text-decoration:none;transition:all 0.25s;}
        .btn-retry:hover{background:var(--gold-glow);color:#fff;}

        /* ── PORTRAIT CARD PREMIUM ── */
        .portrait-card{
            background:var(--surface);border:1px solid rgba(255,255,255,0.06);
            border-radius:var(--radius-lg);padding:60px 40px 50px;
            position:relative;overflow:hidden;
            box-shadow:0 30px 80px rgba(0,0,0,0.6);
            display:flex;flex-direction:column;gap:48px;
        }
        .portrait-card::before{
            content:'';position:absolute;top:0;left:0;right:0;
            height:4px;background:var(--mask-gradient);
        }
        .portrait-card::after{
            content:'';position:absolute;top:0;left:0;right:0;bottom:0;
            background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 70%);
            pointer-events:none;
        }

        /* ── HEADER ── */
        .profile-header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;}
        .greeting{font-family:var(--font-display);font-size:1.4rem;font-style:italic;color:var(--text-secondary);opacity:0.9;margin-bottom:28px;}
        .greeting em{color:var(--gold);font-style:normal;}

        .mask-circle{
            width:220px;height:220px;border-radius:50%;
            margin:16px auto 12px;position:relative;
            box-shadow:0 0 60px var(--mc),0 0 120px rgba(0,0,0,0.6);
            animation:floatGlow 4s ease-in-out infinite alternate;
            display:flex;align-items:center;justify-content:center;
            background:transparent;
        }
        .mask-circle img{
            width:100%;height:100%;object-fit:contain;
            border-radius:50%;filter:drop-shadow(0 0 20px var(--mc));
            z-index:2;
        }
        @keyframes floatGlow{
            from{box-shadow:0 0 40px var(--mc),0 0 80px rgba(0,0,0,0.5)}
            to{box-shadow:0 0 80px var(--mc),0 0 160px rgba(0,0,0,0.7)}
        }

        .profile-type-badge{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--mc);opacity:0.85;margin-bottom:4px;}
        .mask-name{font-family:var(--font-display);font-size:4.5rem;font-weight:300;line-height:1.05;text-align:center;color:var(--mc);margin-bottom:4px;letter-spacing:-0.02em;}
        .mask-protect{font-family:var(--font-display);font-size:1.3rem;font-style:italic;color:var(--text-secondary);text-align:center;margin-bottom:24px;}

        /* ── MIRROR ── */
        .mirror-phrase{
            font-family:var(--font-display);font-size:2.6rem;font-style:italic;
            color:var(--text);padding:44px 20px;
            text-align:center;
            line-height:1.45;margin:8px 0;
            position:relative;z-index:1;
        }
        .mirror-phrase::before{content:'"';position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:9rem;color:var(--mc);opacity:0.14;line-height:1;pointer-events:none;}

        /* ── BEHAVIOURS (ligne discrète) ── */
        .behaviours-inline{
            font-size:1rem;color:var(--text-dim);text-align:center;
            line-height:1.8;z-index:1;letter-spacing:0.3px;
            margin:8px 0 16px;
        }
        .behaviours-inline span{color:var(--text-secondary);}

        /* ── FORCE ── */
        .force-block{margin:20px 0;z-index:1;background:linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 50%);border:1px solid rgba(201,168,76,0.15);border-radius:var(--radius-md);padding:32px 36px;}
        .force-label{font-family:var(--font-display);font-size:1rem;letter-spacing:3px;text-transform:uppercase;color:var(--mc);margin-bottom:12px;display:block;}
        .force-text{font-family:var(--font-display);font-size:1.7rem;font-style:italic;color:var(--text);line-height:1.5;}

        /* ── COMBO ── (conservé pour usage satellites) */
        .combo-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-md);padding:28px 32px;margin:16px 0;font-size:1.05rem;color:var(--text-secondary);line-height:1.7;z-index:1;}
        .combo-box strong{color:var(--text);font-weight:500;}
        .combo-name{font-family:var(--font-display);font-size:1.5rem;font-weight:400;color:var(--mc);margin-bottom:12px;display:block;}

        /* ── SPA ── */
        .spa-block{display:flex;align-items:center;gap:20px;padding:24px 30px;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.15);border-radius:var(--radius-md);margin:16px 0;z-index:1;}
        .spa-sun{font-size:2.2rem;opacity:0.95;flex-shrink:0;}
        .spa-text{font-size:1rem;color:var(--text-secondary);line-height:1.6;}
        .spa-text strong{color:var(--gold);}

        /* ── DEO NOTE ── */
        .deo-note{margin:24px 0 0;padding:18px 24px;background:rgba(255,255,255,0.02);border-left:2px solid rgba(255,255,255,0.08);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:1rem;color:var(--text-dim);line-height:1.7;z-index:1;}
        .deo-note a{color:var(--text-secondary);text-decoration:none;}
        .deo-note a:hover{color:var(--gold);}

        /* ── CTA ── */
        .btn-cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--mc);color:var(--bg);font-family:var(--font-body);font-size:1.1rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:22px;border-radius:60px;text-decoration:none;margin:24px 0 0;transition:all 0.25s;border:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,0.5);z-index:1;}
        .btn-cta:hover{filter:brightness(1.1);transform:translateY(-2px);}

        /* ── SHARE SECTION (deux boutons) ── */
        .share-section{margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.07);text-align:center;z-index:1;}
        .share-title{font-family:var(--font-display);font-size:1.7rem;font-weight:400;margin-bottom:6px;}
        .share-subtitle{font-size:0.95rem;color:var(--text-secondary);margin-bottom:24px;}
        .share-buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;}

        .share-btn{
            display:inline-flex;align-items:center;gap:10px;
            background:var(--mc);color:var(--bg);
            border:1px solid var(--mc);border-radius:40px;
            padding:14px 32px;font-size:1rem;font-weight:500;
            cursor:pointer;transition:all 0.2s;
            box-shadow:0 6px 20px rgba(0,0,0,0.4);
            text-decoration:none;
        }
        .share-btn:hover{background:var(--gold-dark);border-color:var(--gold-dark);transform:translateY(-1px);}

        .share-btn.download{
            background:transparent;color:var(--mc);border:1px solid var(--mc);
        }
        .share-btn.download:hover{background:var(--mc);color:var(--bg);}

        .share-btn.whatsapp{
            background:#25D366;border-color:#25D366;color:#fff;
        }
        .share-btn.whatsapp:hover{background:#1da851;border-color:#1da851;}

        .share-generating{text-align:center;font-size:0.85rem;color:var(--text-dim);padding:12px;display:none;}
        .share-note{font-size:0.75rem;color:var(--text-dim);margin-top:10px;display:none;}

        /* ── NOUVEAUX BLOCS PORTRAIT ── */
        .block-label{font-family:var(--font-body);font-size:0.68rem;font-style:normal;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;display:block;margin-bottom:10px;}
        .voice-block{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-left:3px solid var(--mc);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:24px 28px;margin:18px 0;font-family:var(--font-display);font-size:1.2rem;font-style:italic;color:var(--text-secondary);line-height:1.75;}
        .voice-block .block-label{color:var(--mc);}
        .scene-block{background:rgba(255,255,255,0.02);border-radius:var(--radius-md);padding:20px 24px;margin:14px 0;font-size:1.05rem;color:var(--text-secondary);line-height:1.8;}
        .scene-block .block-label{color:var(--text-dim);}
        .scene-block strong{color:var(--text);font-weight:400;}
        .cout-block{padding:14px 0 6px;font-family:var(--font-display);font-size:1.2rem;font-style:italic;color:var(--text-secondary);border-top:1px solid rgba(255,255,255,0.06);margin:4px 0 14px;line-height:1.65;}
        .cout-block .block-label{font-family:var(--font-body);font-style:normal;color:var(--text-dim);}
        .reframe-block{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.12);border-radius:var(--radius-md);padding:22px 26px;margin:16px 0;}
        .reframe-q{font-size:1rem;color:var(--text-dim);font-style:italic;margin-bottom:10px;line-height:1.65;}
        .reframe-q::before{content:'\201C';color:var(--gold);margin-right:2px;}
        .reframe-q::after{content:'\201D';color:var(--gold);margin-left:2px;}
        .reframe-r{font-size:1.05rem;color:var(--text);line-height:1.7;}
        .reframe-r::before{content:'\2192  ';color:var(--gold);}

        /* ── NARRATIVE STRUCTURE ── */
        .section-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.25),transparent);margin:28px 0;}
        .section-title{display:block;font-family:var(--font-body);font-size:.78rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--mc);margin-bottom:14px;opacity:.9;}
        .opening-def{font-size:1.1rem;color:var(--text-secondary);line-height:1.85;text-align:center;padding:0 4px;font-style:italic;margin-top:8px;}
        .section-bridge{font-size:1rem;color:var(--text-dim);font-style:italic;margin-top:14px;line-height:1.75;}
        .behaviour-prose{font-size:1.05rem;color:var(--text-secondary);line-height:1.8;margin-top:14px;}
        .voice-intro{font-size:1rem;color:var(--text-secondary);margin-bottom:12px;font-style:italic;}
        .force-intro{font-size:1.05rem;color:var(--text-secondary);line-height:1.8;margin-bottom:14px;}
        .cta-zone{text-align:center;margin:8px 0 4px;}
        .cta-text{font-size:1.1rem;color:var(--text-secondary);line-height:1.8;margin-bottom:20px;text-align:center;}
        .reframe-universal{font-size:1.1rem;color:var(--text);line-height:1.85;margin-bottom:18px;}
        .btn-liberation{display:block;width:fit-content;margin:0 auto;background:transparent;border:1.5px solid var(--mc);color:var(--mc);font-family:var(--font-body);font-size:.75rem;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:14px 36px;border-radius:2px;text-decoration:none;transition:all .25s;}
        .btn-liberation:hover{background:rgba(201,168,76,.08);color:var(--text);transform:translateY(-1px);}

        /* ── LAYOUT ÉDITORIAL ── */
        .cout-band{margin:0 -40px;padding:36px 48px;background:rgba(0,0,0,.35);text-align:center;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);}
        .cout-band .section-title{text-align:center;}
        .reframe-block{background:rgba(201,168,76,.04);border:1px solid rgba(201,168,76,.12);border-radius:var(--radius-md);padding:24px 28px;margin:4px 0;}
        @media(max-width:720px){
            .cout-band{margin:0 -20px;padding:28px 24px;}
            .mirror-phrase{font-size:1.9rem;padding:28px 16px;}
        }

        /* ── MODAL CARTE ── */
        #card-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;flex-direction:column;padding:20px;backdrop-filter:blur(8px);}
        #card-modal.open{display:flex;}
        #card-modal canvas,#card-modal img{max-width:100%;max-height:70vh;border-radius:4px;box-shadow:0 24px 80px rgba(0,0,0,.6);}
        .modal-close{position:absolute;top:20px;right:24px;background:none;border:none;color:rgba(255,255,255,.5);font-size:28px;cursor:pointer;line-height:1;padding:8px;}
        .modal-close:hover{color:#fff;}
        .modal-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center;}
        .modal-btn{font-family:var(--font-body);font-size:.72rem;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;padding:12px 28px;border-radius:2px;cursor:pointer;transition:all .2s;border:1.5px solid;}
        .modal-btn-dl{background:var(--mc);color:var(--bg);border-color:var(--mc);}
        .modal-btn-dl:hover{filter:brightness(1.1);}
        .modal-btn-wa{background:transparent;color:var(--text);border-color:rgba(255,255,255,.2);}
        .modal-btn-wa:hover{border-color:var(--text);}
        .modal-generating{font-size:.85rem;color:var(--text-secondary);margin-top:12px;font-style:italic;}

        /* ── BOUTONS RÉSEAUX SOCIAUX ── */
        .share-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;max-width:480px;margin-left:auto;margin-right:auto;}
        .sn-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);cursor:pointer;font-family:var(--font-body);font-size:.82rem;font-weight:400;color:var(--text);transition:all .2s;text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none;}
        .sn-btn:hover{background:rgba(255,255,255,.07);transform:translateY(-1px);}
        .sn-ico{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
        .sn-btn.wa{border-color:rgba(37,211,102,.25);} .sn-btn.wa:hover{background:rgba(37,211,102,.07);}
        .sn-btn.fb{border-color:rgba(24,119,242,.25);} .sn-btn.fb:hover{background:rgba(24,119,242,.07);}
        .sn-btn.tw{border-color:rgba(255,255,255,.15);} .sn-btn.tw:hover{background:rgba(255,255,255,.07);}
        .sn-btn.ig{border-color:rgba(225,48,108,.25);} .sn-btn.ig:hover{background:rgba(225,48,108,.07);}
        .ico-wa{background:#25D366;}
        .ico-fb{background:#1877F2;}
        .ico-tw{background:#000;border:1px solid rgba(255,255,255,.2);}
        /* Toast */
        #share-toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1917;color:var(--text);font-size:.88rem;padding:14px 26px;border-radius:8px;border:1px solid rgba(201,168,76,.3);opacity:0;transition:all .35s;pointer-events:none;z-index:2000;text-align:center;max-width:90vw;}
        #share-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        /* Flèches pour la boucle */
        .loop-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
        .loop-step{font-size:0.95rem;color:var(--text-secondary);line-height:1.6;}
        .loop-arrow{color:var(--gold);font-size:1.1rem;margin:0 2px;}
    </style>
</head>
<body>
<div class="chroma"></div>
<div id="share-toast"></div>

<!-- MODAL PRÉVISUALISATION CARTE -->
<div id="card-modal">
    <button class="modal-close" onclick="closeCardModal()">×</button>
    <div id="modal-canvas-container"></div>
    <p class="modal-generating" id="modal-generating-text" style="display:none">Génération en cours…</p>
    <div class="modal-actions">
        <button class="modal-btn modal-btn-dl" onclick="downloadCardFromModal()">⬇ Télécharger</button>
        <button class="modal-btn modal-btn-wa" onclick="shareViaWhatsApp()">📤 WhatsApp</button>
    </div>
</div>

<!-- LOADING -->
<div id="loading">
    <div class="load-ring"></div>
    <p class="load-text">Analyse en cours…</p>
</div>

<!-- ERROR -->
<div id="error-screen">
    <h2>Résultats introuvables</h2>
    <p>Nous n'avons pas pu charger votre portrait.<br>Relancez le test pour obtenir vos résultats.</p>
    <a href="questionnaire-eclair.html" class="btn-retry">Refaire le test →</a>
</div>

<!-- PORTRAIT -->
<div class="page" id="portrait-page" style="display:none">
    <div id="portrait-content"></div>
</div>

<!-- CARTE OFF-SCREEN (pour le QR code de la carte) -->
<div id="share-card" style="position:fixed;left:-9999px;top:-9999px;width:400px;height:400px;background:#0B0A0A;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;">
    <div class="sc-chroma" style="height:5px;background:linear-gradient(90deg,#B5312A,#C4581F,#B8930A,#2D7A4F,#1D5F8A,#5C3280,#7A3594);"></div>
    <div class="sc-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 5px);padding:24px 28px;text-align:center;position:relative;">
        <div class="sc-img-wrap" id="sc-img-wrap" style="width:100px;height:100px;border-radius:50%;overflow:hidden;position:relative;margin-bottom:16px;">
            <img class="sc-img" src="" alt="Masque" id="sc-img" style="width:100%;height:100%;object-fit:cover;">
            <div class="sc-overlay" id="sc-overlay" style="position:absolute;inset:0;border-radius:50%;background:var(--sc-color,#C9A84C);opacity:0.3;"></div>

// ── LECTURE DES SCORES URL ─────────────────────────────
function readData() {
    const p = new URLSearchParams(location.search);
    const scores = {};
    MASKS.forEach(m => { if(p.has(m)) scores[m] = Math.min(100, Math.max(0, parseInt(p.get(m)) || 0)); });
    const validCount = MASKS.filter(m => scores[m] !== undefined).length;
    const prenom = decodeURIComponent(p.get('prenom') || '');
    const email  = sessionStorage.getItem('vEmail') || '';
    return { scores, prenom, email, valid: validCount === 7 };
}

// ── NOUVEL ALGORITHME DE PROFIL (mono dominant + satellites) ─
function detectProfile(scores) {
    const sorted = MASKS.map(m => ({ key: m, pct: scores[m] || 0 }))
        .sort((a, b) => b.pct - a.pct || TIEBREAK.indexOf(a.key) - TIEBREAK.indexOf(b.key));
    const S1 = sorted[0].pct;

    // Masques actifs selon seuils
    const active = sorted.filter(m => m.pct >= MASK_THRESHOLDS[m.key]);

    // Adaptatif si aucun masque n'atteint son seuil
    if (active.length === 0) {
        return {
            type: S1 < 30 ? 'adaptatif_eq' : 'adaptatif_vig',
            primary: sorted[0].key,
            masks: sorted.map(m => m.key),
            satellites: []
        };
    }

    // Pan-masques : ≥5 actifs avec spread ≤20
    if (active.length >= 5) {
        const spread = Math.max(...active.map(m => m.pct)) - Math.min(...active.map(m => m.pct));
        if (spread <= 20) {
            return {
                type: 'pan',
                primary: active[0].key,
                masks: active.map(m => m.key),
                satellites: []
            };
        }
    }

    // Dominant = ratio score/seuil le plus élevé
    const withRatio = active.map(m => ({
        ...m,
        ratio: m.pct / MASK_THRESHOLDS[m.key]
    }));
    withRatio.sort((a, b) => b.ratio - a.ratio || TIEBREAK.indexOf(a.key) - TIEBREAK.indexOf(b.key));
    const dominant = withRatio[0];

    // Satellites Orange/Jaune (non dominants)
    const satellites = [];
    if (dominant.key !== 'orange' && (scores.orange || 0) >= MASK_THRESHOLDS.orange) satellites.push('orange');
    if (dominant.key !== 'jaune' && (scores.jaune || 0) >= MASK_THRESHOLDS.jaune) satellites.push('jaune');

    // Type mono selon intensité
    let type;
    if (dominant.pct >= 75) type = 'mono';
    else if (dominant.pct >= 60) type = 'mono_fort';
    else type = 'residuel';

    return {
        type,
        primary: dominant.key,
        masks: [dominant.key],
        satellites
    };
}

function generateQRCode() {

        text: 'https://valeur.psyh.fr/questionnaire-eclair.html',

        colorLight: '#0B0A0A',

}

async function loadImg(src) {
    try {
        var res = await fetch(src);
        if (!res.ok) return null;
        var blob = await res.blob();
        var blobUrl = URL.createObjectURL(blob);
        return new Promise(function(resolve) {
            var img = new Image();
            img.onload  = function() { URL.revokeObjectURL(blobUrl); resolve(img); };
            img.onerror = function() { URL.revokeObjectURL(blobUrl); resolve(null); };
            img.src = blobUrl;
        });
    } catch(e) { return null; }
}

function wrapLines(ctx, text, maxW) {
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
        var test = line + words[i] + ' ';
        if (ctx.measureText(test).width > maxW && i > 0) {
            lines.push(line.trim());
            line = words[i] + ' ';
        } else { line = test; }
    }
    if (line.trim()) lines.push(line.trim());
    return lines;
}

async function generatePremiumCard() {
    var W=1080, H=1920;
    var cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
    var ctx=cvs.getContext('2d');
    var col=MASK_COLORS[_dom]||'#C9A84C', viral=VIRAL[_dom]||'', mName='Masque '+MASK_LABELS[_dom];
    try{await document.fonts.ready;}catch(e){}
    var img=await loadImg((_dom==='pan')?'pan-masque.png':'masque-'+_dom+'.png');
    var rgb=(function(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];})(col);
    var ca=function(a){return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';};
    ctx.fillStyle='#09080A'; ctx.fillRect(0,0,W,H);
    var amb=ctx.createRadialGradient(W/2,H*.24,0,W/2,H*.24,H*.38);
    amb.addColorStop(0,ca(.2)); amb.addColorStop(1,'transparent');
    ctx.fillStyle=amb; ctx.fillRect(0,0,W,H);
    var CX=W/2, CY=H*.24, R=W*.245;
    var go=ctx.createRadialGradient(CX,CY,R*.4,CX,CY,R*2.1);
    go.addColorStop(0,ca(.44)); go.addColorStop(.5,ca(.12)); go.addColorStop(1,'transparent');
    ctx.fillStyle=go; ctx.beginPath(); ctx.arc(CX,CY,R*2.1,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();
    if(img){
        var iw=img.naturalWidth||R*2, ih=img.naturalHeight||R*2;
        var sc=Math.min(R*2/iw,R*2/ih), dw=iw*sc, dh=ih*sc;
        ctx.drawImage(img,CX-dw/2,CY-dh/2,dw,dh);
        ctx.fillStyle=ca(.16); ctx.fillRect(CX-R,CY-R,R*2,R*2);
    } else {
        var sp=ctx.createRadialGradient(CX-R*.3,CY-R*.32,0,CX,CY,R);
        sp.addColorStop(0,'rgba(255,255,255,.28)'); sp.addColorStop(.3,ca(.95));
        sp.addColorStop(.75,ca(.68)); sp.addColorStop(1,ca(.22));
        ctx.fillStyle=sp; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle=ca(.5); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke();
    ctx.textAlign='center'; ctx.fillStyle=col;
    ctx.font='300 '+(W*.098)+'px "Cormorant Garamond",Georgia,serif';
    ctx.fillText(mName,CX,H*.535);
    var lg=ctx.createLinearGradient(CX-110,0,CX+110,0);
    lg.addColorStop(0,'transparent'); lg.addColorStop(.5,ca(.6)); lg.addColorStop(1,'transparent');
    ctx.strokeStyle=lg; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(CX-110,H*.555); ctx.lineTo(CX+110,H*.555); ctx.stroke();
    ctx.fillStyle='rgba(240,235,225,.46)';
    ctx.font='italic 300 '+(W*.030)+'px "Cormorant Garamond",Georgia,serif';
    ctx.fillText("Ce n\u2019est pas vous. C\u2019est votre protection.",CX,H*.578);
    ctx.fillStyle='#EDE8DF';
    var vSize=W*.048; ctx.font='italic 300 '+vSize+'px "Cormorant Garamond",Georgia,serif';
    var vLines=wrapLines(ctx,viral,W*.83), lH=vSize*1.58, bH=vLines.length*lH;
    var zTop=H*.60, zH=H*.21, sY=zTop+(zH-bH)/2+lH;
    vLines.forEach(function(l,i){ctx.fillText(l,CX,sY+i*lH);});
    var sg=ctx.createLinearGradient(W*.12,0,W*.88,0);
    sg.addColorStop(0,'transparent'); sg.addColorStop(.4,ca(.4)); sg.addColorStop(.6,ca(.4)); sg.addColorStop(1,'transparent');
    ctx.strokeStyle=sg; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(W*.12,H*.865); ctx.lineTo(W*.88,H*.865); ctx.stroke();
    ctx.fillStyle='rgba(201,168,76,.95)'; ctx.font='500 '+(W*.027)+'px "Jost",sans-serif';
    ctx.fillText('V.A.L.E.U.R\u00A9',CX,H*.900);
    ctx.fillStyle='rgba(107,100,96,.8)'; ctx.font='300 '+(W*.020)+'px "Jost",sans-serif';
    ctx.fillText('VALEUR.PSYH.FR',CX,H*.922);
    ['#B5312A','#C4581F','#B8930A','#2D7A4F','#1D5F8A','#5C3280','#7A3594'].forEach(function(c7,i){
        ctx.fillStyle=c7; ctx.fillRect(i*W/7,0,W/7+1,7); ctx.fillRect(i*W/7,H-7,W/7+1,7);
    });
    return cvs;
}

async function openCardModal() {
    var modal = document.getElementById('card-modal');
    var container = document.getElementById('modal-canvas-container');
    var genTxt = document.getElementById('modal-generating-text');
    modal.classList.add('open');
    container.innerHTML = '';
    genTxt.style.display = 'block';
    try {
        var canvas = await generatePremiumCard();
        _modalCanvas = canvas;
        var preview = document.createElement('canvas');
        var scale = Math.min(1, (window.innerHeight * 0.68) / canvas.height);
        preview.width  = canvas.width  * scale;
        preview.height = canvas.height * scale;
        var pctx = preview.getContext('2d');
        pctx.drawImage(canvas, 0, 0, preview.width, preview.height);
        container.appendChild(preview);
    } catch(e) {
        container.innerHTML = '<p style="color:var(--text-secondary);font-size:.9rem">Impossible de générer la carte.</p>';
    }
    genTxt.style.display = 'none';
}

function closeCardModal() { document.getElementById('card-modal').classList.remove('open'); }
document.addEventListener('click', function(e) { if (e.target === document.getElementById('card-modal')) closeCardModal(); });

async function downloadCardFromModal() {
    var canvas = _modalCanvas || await generatePremiumCard();
    canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'mon-masque-valeur-' + (_dom||'') + '.png';
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    }, 'image/png');
}

async function saveToDatabase(data, profile) {
    const { scores, prenom, email } = data;
    const dom = profile.primary;
    const payload = {
        prenom, email,
        masque_dominant: MASK_LABELS[dom],
        peur_centrale: FEARS[dom],
        profile_type: profile.type,
        test_type: 'flash',
        date_passation: new Date().toISOString().split('T')[0],
        scores: JSON.stringify(scores)
    };
    try {
        const r = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-cabinet-secret': API_SECRET },
            body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
    } catch(e) { console.warn('DB save skipped:', e.message); return null; }
}

function sendPortraitEmail(data, profile) {
    if (!data.email) return;
    const dom = profile.primary;
    try {
        emailjs.init({ publicKey: 'Qamyb35cCRJ5Pulqs' });
        emailjs.send('service_valeur', 'template_c2ru3wm', {
            to_email:        data.email,
            prenom:          data.prenom || 'vous',
            masque_dominant: MASK_LABELS[dom],
            peur_centrale:   FEARS[dom],
            lien_rapport:    window.location.href,
            lien_psycho:     'https://www.doctolib.fr/psychologue/bordeaux/celine-bourbon/booking/motives?specialityId=14&telehealth=false&placeId=practice-362188&pid=practice-362188&source=profile',
            date_passation:  new Date().toLocaleDateString('fr-FR')
        });
    } catch(e) { console.warn('Email skipped:', e.message); }
}

let _dom, _color, _viral, _modalCanvas;

async function init() {
    const data = readData();
    if (!data.valid) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-screen').style.display = 'block';
        return;
    }

    const profile = detectProfile(data.scores);
    _dom    = profile.primary;
    _color  = MASK_COLORS[_dom];
    _viral  = VIRAL[_dom] || (profile.type === 'pan' ? VIRAL.pan : VIRAL.adaptatif);

    document.getElementById('portrait-content').innerHTML = buildPortrait(data, profile);

    const items = document.querySelectorAll('.portrait-card > *');
    items.forEach((el, i) => { el.style.animation = `fadeUp 0.5s ease ${i * 0.06}s both`; });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('portrait-page').style.display = 'block';

    saveToDatabase(data, profile);
    if (data.email) sendPortraitEmail(data, profile);
}
